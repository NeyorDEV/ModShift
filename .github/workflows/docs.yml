name: Docs

# Construit le site VitePress (docs/) et le déploie sur GitHub Pages à chaque push sur main.
# GitHub Pages doit d'abord être activé à la main : Settings → Pages → Source : GitHub Actions.
# Tant que ce n'est pas fait, le job de déploiement échoue sans effet de bord.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'action/README.md', 'bench/README.md', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois ; on n'interrompt pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
