name: Release

# Déclenché par un tag de version (ex. v0.1.0). Construit, teste, puis crée la release GitHub
# avec les notes de CHANGELOG.md et l'archive npm en pièce jointe. Ne publie RIEN sur npm.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage

      # `npm pack` déclenche `prepack` (nettoyage + build).
      - name: Build the npm tarball
        run: npm pack

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" modshift-*.tgz \
            --title "ModShift $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag $prerelease
