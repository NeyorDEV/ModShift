name: Bug report
description: ModShift crashed, gave a wrong result, or produced an invalid pack.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** paste API keys (e.g. `CURSEFORGE_API_KEY`).
        For security issues, use a private security advisory instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: ModShift version
      description: Output of `modshift --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.11, Windows 11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
      placeholder: modshift migrate my-pack.mrpack --mc 1.21.1 --loader neoforge --out out.mrpack
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Full output, ideally with `--verbose`.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: pack
    attributes:
      label: Pack details
      description: Source and target (e.g. 1.20.1 Forge → 1.21.1 NeoForge), and a link to the pack or the mods involved if public.
